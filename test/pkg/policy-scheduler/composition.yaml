apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: policy-scheduler
  labels:
    provider: aws
    type: policy-scheduler
spec:
  compositeTypeRef:
    apiVersion: infra.example.com/v1alpha1
    kind: XPolicyScheduler
  
  mode: Pipeline
  pipeline:
    - step: create-role
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: production-role
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: Role
              metadata:
                name: production-access-role
              spec:
                forProvider:
                  description: "Production access role with time-based policy attachment"
                  assumeRolePolicy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [
                        {
                          "Effect": "Allow",
                          "Principal": {
                            "Service": "ec2.amazonaws.com"
                          },
                          "Action": "sts:AssumeRole"
                        },
                        {
                          "Effect": "Allow",
                          "Principal": {
                            "AWS": "arn:aws:iam::*:root"
                          },
                          "Action": "sts:AssumeRole",
                          "Condition": {
                            "DateGreaterThan": {
                              "aws:CurrentTime": "2025-01-01T09:00:00Z"
                            },
                            "DateLessThan": {
                              "aws:CurrentTime": "2025-12-31T17:00:00Z"
                            }
                          }
                        }
                      ]
                    }
                  tags:
                    Environment: production
                    Purpose: time-restricted-access
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-role"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.roleName
                toFieldPath: spec.forProvider.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.description
                toFieldPath: spec.forProvider.description
              
    - step: create-production-policy
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: production-policy
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: Policy
              metadata:
                name: production-access-policy
              spec:
                forProvider:
                  description: "Production access policy with time restrictions"
                  policy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [
                        {
                          "Effect": "Allow",
                          "Action": [
                            "ec2:*",
                            "s3:*",
                            "rds:*",
                            "lambda:*"
                          ],
                          "Resource": "*",
                          "Condition": {
                            "DateGreaterThan": {
                              "aws:CurrentTime": "09:00:00Z"
                            },
                            "DateLessThan": {
                              "aws:CurrentTime": "17:00:00Z"
                            }
                          }
                        }
                      ]
                    }
                  tags:
                    Environment: production
                    Purpose: time-restricted-policy
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-policy"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.policyName
                toFieldPath: spec.forProvider.name

    - step: attach-policy-to-role
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: policy-attachment
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: RolePolicyAttachment
              metadata:
                name: production-policy-attachment
              spec:
                forProvider:
                  roleSelector:
                    matchControllerRef: true
                  policyArnSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-attachment"

    - step: create-time-scheduler
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: scheduler-lambda
            base:
              apiVersion: lambda.aws.upbound.io/v1beta1
              kind: Function
              metadata:
                name: policy-scheduler-function
              spec:
                forProvider:
                  description: "Lambda function to manage time-based policy attachments"
                  runtime: python3.9
                  handler: index.handler
                  role: "arn:aws:iam::123456789012:role/lambda-execution-role"
                  code:
                    zipFile: |
                      import json
                      import boto3
                      import datetime
                      from dateutil import tz
                      
                      def handler(event, context):
                          iam = boto3.client('iam')
                          
                          # Get current time
                          utc = tz.gettz('UTC')
                          now = datetime.datetime.now(utc)
                          current_hour = now.hour
                          
                          # Define access window (9 AM to 5 PM UTC)
                          start_hour = 9
                          end_hour = 17
                          
                          role_name = event.get('role_name')
                          policy_arn = event.get('policy_arn')
                          
                          if start_hour <= current_hour < end_hour:
                              # Within access window - ensure policy is attached
                              try:
                                  iam.attach_role_policy(
                                      RoleName=role_name,
                                      PolicyArn=policy_arn
                                  )
                                  return {
                                      'statusCode': 200,
                                      'body': json.dumps(f'Policy attached to {role_name}')
                                  }
                              except Exception as e:
                                  return {
                                      'statusCode': 500,
                                      'body': json.dumps(f'Error attaching policy: {str(e)}')
                                  }
                          else:
                              # Outside access window - ensure policy is detached
                              try:
                                  iam.detach_role_policy(
                                      RoleName=role_name,
                                      PolicyArn=policy_arn
                                  )
                                  return {
                                      'statusCode': 200,
                                      'body': json.dumps(f'Policy detached from {role_name}')
                                  }
                              except Exception as e:
                                  return {
                                      'statusCode': 500,
                                      'body': json.dumps(f'Error detaching policy: {str(e)}')
                                  }
                  tags:
                    Environment: production
                    Purpose: policy-scheduler
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-scheduler"
              # Use timeWindow fields for time boundaries (start/end/timezone)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.timeWindow.timezone
                toFieldPath: spec.forProvider.environment.variables.TIMEZONE
              - type: FromCompositeFieldPath
                fromFieldPath: spec.timeWindow.start
                toFieldPath: spec.forProvider.environment.variables.START_TIME
              - type: FromCompositeFieldPath
                fromFieldPath: spec.timeWindow.end
                toFieldPath: spec.forProvider.environment.variables.END_TIME

    - step: create-event-rule
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: scheduler-event-rule
            base:
              apiVersion: cloudwatchevents.aws.upbound.io/v1beta1
              kind: Rule
              metadata:
                name: policy-scheduler-rule
              spec:
                forProvider:
                  description: "Trigger policy scheduler every hour"
                  scheduleExpression: "rate(1 hour)"
                  state: "ENABLED"
                  tags:
                    Environment: production
                    Purpose: policy-scheduler
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-event-rule"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.schedule.interval
                toFieldPath: spec.forProvider.scheduleExpression
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "rate(%s)"

    - step: create-lambda-permission
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: lambda-permission
            base:
              apiVersion: lambda.aws.upbound.io/v1beta1
              kind: Permission
              metadata:
                name: scheduler-lambda-permission
              spec:
                forProvider:
                  action: "lambda:InvokeFunction"
                  functionNameSelector:
                    matchControllerRef: true
                  principal: "events.amazonaws.com"
                  sourceArnSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-lambda-permission"