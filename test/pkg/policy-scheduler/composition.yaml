apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: policy-scheduler
  labels:
    provider: aws
    type: policy-scheduler
spec:
  compositeTypeRef:
    apiVersion: infra.example.com/v1alpha1
    kind: XPolicyScheduler
  
  mode: Pipeline
  pipeline:
    - step: environmentConfigs
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
          - type: Reference
            ref:
              name: envconfig
    - step: create-role
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |-
            {{ $accountId:=(index .context "apiextensions.crossplane.io/environment").accountId }}
            {{ $region:=(index .context "apiextensions.crossplane.io/environment").region }}
            {{ $roleName:=.observed.composite.resource.spec.roleName }}
            {{ $description:=.observed.composite.resource.spec.description }}
            {{ $compositeResourceName:=.observed.composite.resource.metadata.name }}
            {{ $startTime:=.observed.composite.resource.spec.timeWindow.start }}
            {{ $endTime:=.observed.composite.resource.spec.timeWindow.end }}
            
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: production-role
              name: {{$compositeResourceName}}-role
            spec:
              forProvider:
                name: {{$roleName}}
                description: {{$description}}
                assumeRolePolicy: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Effect": "Allow",
                        "Principal": {
                          "Service": "ec2.amazonaws.com"
                        },
                        "Action": "sts:AssumeRole"
                      },
                      {
                        "Effect": "Allow",
                        "Principal": {
                          "AWS": "arn:aws:iam::{{$accountId}}:root"
                        },
                        "Action": "sts:AssumeRole",
                        "Condition": {
                          "DateGreaterThan": {
                            "aws:CurrentTime": "{{$startTime}}:00Z"
                          },
                          "DateLessThan": {
                            "aws:CurrentTime": "{{$endTime}}:00Z"
                          }
                        }
                      }
                    ]
                  }
                tags:
                  Environment: production
                  Purpose: time-restricted-access
                  Region: {{$region}}
                  AccountId: {{$accountId}}
    - step: create-production-policy
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |-
            {{ $compositeResourceName:=.observed.composite.resource.metadata.name }}
            {{ $policyName:=.observed.composite.resource.spec.policyName }}
            {{ $startTime:=.observed.composite.resource.spec.timeWindow.start }}
            {{ $endTime:=.observed.composite.resource.spec.timeWindow.end }}
            
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Policy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: production-policy
              name: {{$compositeResourceName}}-policy
            spec:
              forProvider:
                name: {{$policyName}}
                description: "Production access policy with time restrictions"
                policy: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Effect": "Allow",
                        "Action": [
                          "ec2:*",
                          "s3:*",
                          "rds:*",
                          "lambda:*"
                        ],
                        "Resource": "*",
                        "Condition": {
                          "DateGreaterThan": {
                            "aws:CurrentTime": "{{$startTime}}:00Z"
                          },
                          "DateLessThan": {
                            "aws:CurrentTime": "{{$endTime}}:00Z"
                          }
                        }
                      }
                    ]
                  }
                tags:
                  Environment: production
                  Purpose: time-restricted-policy

    - step: attach-policy-to-role
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: policy-attachment
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: RolePolicyAttachment
              metadata:
                name: production-policy-attachment
              spec:
                forProvider:
                  roleSelector:
                    matchControllerRef: true
                  policyArnSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-attachment"

    - step: create-time-scheduler
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |-
            {{ $accountId:=(index .context "apiextensions.crossplane.io/environment").accountId }}
            {{ $region:=(index .context "apiextensions.crossplane.io/environment").region }}
            {{ $compositeResourceName:=.observed.composite.resource.metadata.name }}
            {{ $timezone:=.observed.composite.resource.spec.timeWindow.timezone }}
            {{ $startTime:=.observed.composite.resource.spec.timeWindow.start }}
            {{ $endTime:=.observed.composite.resource.spec.timeWindow.end }}
            
            ---
            apiVersion: lambda.aws.upbound.io/v1beta1
            kind: Function
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: scheduler-lambda
              name: {{$compositeResourceName}}-scheduler
            spec:
              forProvider:
                description: "Lambda function to manage time-based policy attachments in {{$region}}"
                runtime: python3.9
                handler: index.handler
                role: "arn:aws:iam::{{$accountId}}:role/lambda-execution-role"
                environment:
                  variables:
                    ACCOUNT_ID: "{{$accountId}}"
                    REGION: "{{$region}}"
                    TIMEZONE: "{{$timezone}}"
                    START_TIME: "{{$startTime}}"
                    END_TIME: "{{$endTime}}"
                code:
                  zipFile: |
                    import json
                    import boto3
                    import datetime
                    import os
                    from dateutil import tz
                    
                    def handler(event, context):
                        # Use environment variables from the template
                        account_id = os.environ.get('ACCOUNT_ID')
                        region = os.environ.get('REGION')
                        timezone = os.environ.get('TIMEZONE', 'UTC')
                        
                        iam = boto3.client('iam', region_name=region)
                        # ... rest of lambda code
                tags:
                  Environment: production
                  Purpose: policy-scheduler
                  Region: {{$region}}
                  AccountId: {{$accountId}}
    - step: create-event-rule
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: scheduler-event-rule
            base:
              apiVersion: cloudwatchevents.aws.upbound.io/v1beta1
              kind: Rule
              metadata:
                name: policy-scheduler-rule
              spec:
                forProvider:
                  description: "Trigger policy scheduler every hour"
                  scheduleExpression: "rate(1 hour)"
                  state: "ENABLED"
                  tags:
                    Environment: production
                    Purpose: policy-scheduler
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-event-rule"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.schedule.interval
                toFieldPath: spec.forProvider.scheduleExpression
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "rate(%s)"

    - step: create-lambda-permission
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: lambda-permission
            base:
              apiVersion: lambda.aws.upbound.io/v1beta1
              kind: Permission
              metadata:
                name: scheduler-lambda-permission
              spec:
                forProvider:
                  action: "lambda:InvokeFunction"
                  functionNameSelector:
                    matchControllerRef: true
                  principal: "events.amazonaws.com"
                  sourceArnSelector:
                    matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-lambda-permission"