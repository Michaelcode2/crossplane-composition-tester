apiVersion: infra.example.com/v1alpha1
kind: XPolicyScheduler
metadata:
  name: test-policy-scheduler
  namespace: default
spec:
  roleName: production-access-role
  policyName: production-access-policy
  description: "Time-restricted production access for daily operations"
  allowedActions:
    - "ec2:*"
    - "s3:*"
    - "rds:Describe*"
    - "rds:List*"
  timeWindow:
    start: "09:00"
    end: "17:00"
    timezone: "UTC"
  schedule:
    interval: "1 hour"
  resources:
    productionEnvironments:
      - "prod"
      - "production"
    restrictedActions:
      - "ec2:TerminateInstances"
      - "rds:DeleteDBInstance"
      - "s3:DeleteBucket"
    emergencyAccess:
      enabled: false
      approvers: []
  compositeDeletePolicy: Background
  compositionRef:
    name: policy-scheduler